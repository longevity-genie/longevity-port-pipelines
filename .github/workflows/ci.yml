name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. Push/pull_request events can silently fail to fire (an Actions outage or an
  # exhausted org minute quota leaves "no checks reported" rather than a red check), and without
  # this there is no way to re-run CI on demand to tell the two apart.
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      BIOHUB_API_TOKEN: ${{ secrets.BIOHUB_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy
        run: uv run mypy src/

      - name: Tests
        run: uv run pytest tests/ -v
